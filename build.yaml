# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # --- Split Setup ---
  - board: xiao_ble//zmk
    shield: karma_left
  - board: xiao_ble//zmk
    shield: karma_right

  # --- Dongle Setup ---
  - board: xiao_ble//zmk
    shield: karma_dongle
  - board: nrf52840dongle/nrf52840
    shield: karma_dongle
    artifact-name: karma_dongle_holyiot
    cmake-args: -DCONFIG_BOARD_ENABLE_DCDC=n -DCONFIG_BOARD_ENABLE_DCDC_HV=n -DCONFIG_BUILD_OUTPUT_UF2=n -DCONFIG_BUILD_OUTPUT_HEX=y
  - board: xiao_ble//zmk
    shield: karma_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: karma_left_peripheral-xiao_ble__zmk-zmk

  # --- Reset Firmware ---
  - board: xiao_ble//zmk
    shield: settings_reset
